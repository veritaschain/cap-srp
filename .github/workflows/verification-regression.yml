name: CAP-SRP verification regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Target binding and fail-closed regression
        run: python -m pytest tests/test_verification_fail_closed.py -v --junitxml=regression-results.xml
      - name: Package reviewed source for reproducibility
        if: always()
        run: |
          mkdir -p regression-evidence
          git archive --format=zip --output=regression-evidence/reviewed-source.zip HEAD cap_srp tests pyproject.toml README.md
          git rev-parse HEAD > regression-evidence/checkout.txt
          python -m pip freeze > regression-evidence/dependencies.txt
          test ! -f regression-results.xml || cp regression-results.xml regression-evidence/
          sha256sum regression-evidence/reviewed-source.zip > regression-evidence/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cap-srp-verification-${{ github.run_id }}
          path: regression-evidence/
          retention-days: 14
